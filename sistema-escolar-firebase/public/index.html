<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema Escolar Thomas Jefferson</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/animaciones.css">
    <link rel="stylesheet" href="css/loading.css">
    
    <style>
        /* Estilos específicos del login */
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 10;
        }
        
        .login-card {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 480px;
            width: 100%;
            animation: slideUp 0.6s ease-out;
        }
        
        .login-header {
            text-align: center;
            padding: 30px 20px 20px;
        }
        
        .login-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            animation: bounceIn 0.8s ease-out;
        }
        
        .login-title {
            color: #f1f5f9;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .login-subtitle {
            color: #94a3b8;
            font-size: 14px;
        }
        
        .login-body {
            padding: 30px;
        }
        
        /* Input personalizado con icono */
        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }
        
        .input-group-custom i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 18px;
            transition: color 0.3s;
        }
        
        .input-group-custom input {
            background: rgba(51, 65, 85, 0.8);
            border: 2px solid rgba(71, 85, 105, 0.5);
            border-radius: 12px;
            padding: 14px 15px 14px 50px;
            color: #f1f5f9;
            width: 100%;
            font-size: 15px;
            transition: all 0.3s;
        }
        
        .input-group-custom input:focus {
            outline: none;
            border-color: #6366f1;
            background: rgba(51, 65, 85, 0.95);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }
        
        .input-group-custom input:focus + i {
            color: #6366f1;
        }
        
        .input-group-custom input::placeholder {
            color: #64748b;
        }
        
        /* Checkbox personalizado */
        .checkbox-custom {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }
        
        .checkbox-custom input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #6366f1;
        }
        
        .checkbox-custom label {
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
            margin: 0;
        }
        
        /* Botón principal */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Links */
        .login-footer {
            text-align: center;
            padding: 20px 30px 30px;
        }
        
        .forgot-password {
            color: #6366f1;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        
        .forgot-password:hover {
            color: #8b5cf6;
            text-decoration: underline;
        }
        
        .register-link {
            color: #94a3b8;
            font-size: 14px;
        }
        
        .register-link a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
        }
        
        .register-link a:hover {
            text-decoration: underline;
        }
        
        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(71, 85, 105, 0.5);
        }
        
        .divider span {
            padding: 0 15px;
            color: #64748b;
            font-size: 13px;
        }
        
        /* Botones sociales */
        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .btn-social {
            padding: 12px;
            background: rgba(51, 65, 85, 0.6);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-social:hover {
            background: rgba(51, 65, 85, 0.9);
            border-color: #6366f1;
            transform: translateY(-2px);
        }
        
        .btn-social svg {
            width: 20px;
            height: 20px;
        }
        
        /* Alertas */
        .alert-custom {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            animation: shake 0.5s;
        }
        
        .alert-custom.show {
            display: block;
        }
        
        .alert-custom.success {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }
        
        /* Responsive */
        @media (max-width: 576px) {
            .login-card {
                border-radius: 15px;
            }
            
            .login-header {
                padding: 20px 15px 15px;
            }
            
            .login-body {
                padding: 20px;
            }
            
            .login-title {
                font-size: 24px;
            }
            
            .social-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Wave -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-wave">
            <div class="loading-bar"></div>
            <div class="loading-bar"></div>
            <div class="loading-bar"></div>
            <div class="loading-bar"></div>
        </div>
        <p style="color: #94a3b8; margin-top: 20px; font-size: 14px;">Cargando sistema...</p>
    </div>

    <!-- Fondo con patrón animado -->
    <div class="pattern-bg-container">
        <div class="pattern-bg">
            <svg preserveAspectRatio="xMidYMid slice" height="100%" width="100%" viewBox="0 0 120 104">
                <defs>
                    <linearGradient y2="100%" x2="100%" y1="0%" x1="0%" id="cube-dark">
                        <stop stop-color="#232526" offset="0%"></stop>
                        <stop stop-color="#414345" offset="100%"></stop>
                    </linearGradient>
                    <linearGradient y2="0%" x2="100%" y1="100%" x1="0%" id="cube-mid">
                        <stop stop-color="#4b6cb7" offset="0%"></stop>
                        <stop stop-color="#182848" offset="100%"></stop>
                    </linearGradient>
                    <linearGradient y2="100%" x2="0%" y1="0%" x1="100%" id="cube-light">
                        <stop stop-color="#a8edea" offset="0%"></stop>
                        <stop stop-color="#fed6e3" offset="100%"></stop>
                    </linearGradient>
                </defs>
            </svg>
        </div>
    </div>

    <!-- Contenedor Principal -->
    <div class="login-container">
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <div class="login-logo">
                    <i class="bi bi-mortarboard-fill"></i>
                </div>
                <h1 class="login-title">Sistema Escolar</h1>
                <p class="login-subtitle">Complejo Educativo Thomas Jefferson</p>
            </div>

            <!-- Body -->
            <div class="login-body">
                <!-- Alerta -->
                <div id="alerta" class="alert-custom" role="alert"></div>

                <!-- Formulario -->
                <form id="formLogin">
                    <!-- Email -->
                    <div class="input-group-custom">
                        <input type="email" id="correo" placeholder="correo@clases.edu.sv" required autocomplete="email">
                        <i class="bi bi-envelope-fill"></i>
                    </div>

                    <!-- Password -->
                    <div class="input-group-custom">
                        <input type="password" id="contrasena" placeholder="Contraseña" required autocomplete="current-password">
                        <i class="bi bi-lock-fill"></i>
                    </div>

                    <!-- Código de Seguridad -->
                    <div class="input-group-custom">
                        <input type="text" id="codigoSeguridad" placeholder="Código institucional (CLASES26$COED)" required maxlength="15" autocomplete="off">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="checkbox-custom">
                            <input type="checkbox" id="rememberMe">
                            <label for="rememberMe">Recordarme</label>
                        </div>
                    </div>

                    <!-- Botón Login -->
                    <button type="submit" class="btn-login" id="btnLogin">
                        <span id="btnText">Iniciar Sesión</span>
                        <span id="btnLoading" style="display: none;">
                            <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                            Verificando...
                        </span>
                    </button>
                </form>

                <!-- Divider -->
                <div class="divider">
                    <span>O continúa con</span>
                </div>

                <!-- Social Buttons -->
                <div class="social-buttons">
                    <button class="btn-social" onclick="alert('Próximamente: Login con Google')">
                        <svg viewBox="0 0 24 24">
                            <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        Google
                    </button>
                    <button class="btn-social" onclick="alert('Próximamente: Login con Apple')">
                        <svg viewBox="0 0 24 24">
                            <path fill="currentColor" d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
                        </svg>
                        Apple
                    </button>
                </div>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                <a href="recuperar.html" class="forgot-password">¿Olvidaste tu contraseña?</a>
                <p class="register-link">
                    ¿Eres docente? <a href="registro.html">Regístrate aquí</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
    
    <!-- Script inline para el loading -->
    <script>
        // Ocultar loading después de 2 segundos
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loadingScreen').style.display = 'none';
            }, 2000);
        });
    </script>
</body>
</html>
